[project]
name = "stop-loss"
version = "0.1.0"
description = "StopLoss Intelligence - Multi-Agent Financial Intelligence Terminal (PS5)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "StopLoss Intelligence Team" }
]
dependencies = [
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "tenacity>=8.3.0",
    "python-dotenv>=1.0.0",
    "langchain-core>=1.0,<2",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=3.0,<4",
    "langsmith>=0.4,<1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "numpy>=1.26,<3",
    "langchain-openai>=1,<2",
]

[project.optional-dependencies]
local-embeddings = ["langchain-huggingface>=1,<2", "sentence-transformers>=5,<6"]
openai-embeddings = ["langchain-openai>=1,<2"]
community = ["langchain-community>=0.4,<1", "langchain-text-splitters>=1,<2"]
parsers = ["openpyxl>=3.1,<4", "pypdf>=6,<7", "langdetect>=1.0.9,<2", "xlrd>=2,<3"]
streams = ["websockets>=14,<17"]
historical = ["yfinance>=0.2,<2", "pandas>=2,<4"]

[project.scripts]
stop-loss = "stop_loss.__main__:main"
fin-terminal-ingest = "fin_terminal.ingest:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stop_loss", "src/fin_terminal"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1,<2",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
