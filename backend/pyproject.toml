[project]
name = "stop-loss"
version = "0.1.0"
description = "StopLoss Intelligence - Multi-Agent Financial Intelligence Terminal (PS5)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "StopLoss Intelligence Team" }
]
dependencies = [
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "tenacity>=8.3.0",
    "python-dotenv>=1.0.0",
    "langchain-core>=1.0,<2",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=3.0,<4",
    "langsmith>=0.4,<1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "numpy>=1.26,<3",
    "langchain-openai>=1,<2",
    "yfinance>=0.2.66,<2",
]

[project.optional-dependencies]
local-embeddings = [
    # Plain transformers (no sentence-transformers): its scikit-learn dependency ships DLLs
    # that Windows Application Control blocks on the dev machine (docs/DECISIONS.md ADR T11).
    "transformers>=4.56,<6",
    # CUDA 12.4 wheels: the newest CUDA the RTX 4050 driver (551.x) supports.
    "torch>=2.5,<2.7",
]
openai-embeddings = ["langchain-openai>=1,<2"]
community = ["langchain-community>=0.4,<1", "langchain-text-splitters>=1,<2"]
parsers = ["openpyxl>=3.1,<4", "pypdf>=6,<7", "langdetect>=1.0.9,<2", "xlrd>=2,<3"]
streams = ["websockets>=14,<17"]
historical = ["yfinance>=0.2,<2", "pandas>=2,<4"]

[project.scripts]
stop-loss = "stop_loss.__main__:main"
fin-terminal-ingest = "fin_terminal.ingest:main"
stop-loss-api = "stop_loss.api.app:main"
stop-loss-vectors = "stop_loss.retrieval.cli:main"
stop-loss-universe = "stop_loss.universe:enrich_main"

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu124", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[tool.hatch.build.targets.wheel]
packages = ["src/stop_loss", "src/fin_terminal"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1,<2",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Prompt text is kept verbatim; wrapping it would change what the LLM sees.
"src/stop_loss/agents/llm.py" = ["E501"]
"src/stop_loss/agents/portfolio_llm.py" = ["E501"]
# Manual script: loads .env before importing settings.
"src/stop_loss/test_pinecone.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
